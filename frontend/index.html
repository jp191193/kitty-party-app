<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitty Party Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <header class="app-header">
    <div class="container header-inner">
      <a href="#/" class="brand">
        <span class="brand-logo">K</span>
        <span class="brand-text">Kitty Party</span>
      </a>
      <nav class="nav" id="mainNav">
        <a href="#/" data-route="/">Dashboard</a>
        <a href="#/members" data-route="/members">Members</a>
        <a href="#/groups" data-route="/groups">Groups</a>
        <a href="#/contributions" data-route="/contributions">Contributions</a>
        <a href="#/cycles" data-route="/cycles">Cycles</a>
        <a href="#/payouts" data-route="/payouts">Payouts</a>
      </nav>
      <div class="header-right">
        <div class="current-user" id="currentUserChip" title="Acting as">
          <span class="avatar" id="currentUserAvatar">?</span>
          <span id="currentUserLabel">No user</span>
        </div>
        <button class="btn btn-ghost" id="switchUserBtn" title="Switch acting user">Switch</button>
        <button class="btn btn-ghost icon-btn" id="settingsBtn" title="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="appMain" class="container app-main">
    <div class="loader" id="bootLoader"><div class="spinner"></div><p>Loading…</p></div>
  </main>

  <div id="toastContainer" class="toast-container"></div>
  <div id="modalRoot"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
